name: deploy

# Push to main → build the image on a GitHub runner (off-box; the 1 GB VPS
# can't build comfortably) → push to GHCR → SSH to the box and pull + restart.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kwaddo/skoobl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ship compose + pull & restart on the box
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes"

          # Box only needs the compose file (image is built in CI), not the source.
          $SSH "$DEPLOY_USER@$HOST" 'mkdir -p ~/skoobl/infra'
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            infra/compose.dilmune.yaml "$DEPLOY_USER@$HOST:~/skoobl/infra/compose.dilmune.yaml"

          $SSH "$DEPLOY_USER@$HOST" "
            set -e
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin
            cd ~/skoobl
            docker compose -f infra/compose.dilmune.yaml pull
            docker compose -f infra/compose.dilmune.yaml up -d
            docker image prune -f
            docker logout ghcr.io
          "

      - name: Verify health
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$DEPLOY_USER@$HOST" \
            'sleep 6; curl -fsS -m5 -o /dev/null -w "health=%{http_code}\n" http://127.0.0.1:5533/healthz'
